<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZONYX - The Ancient One Real-Time Spell Casting Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: brightness(0.85) contrast(1.2);
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        /* Minimal Status Indicator */
        #ui-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(10, 10, 15, 0.88);
            border: 1px solid rgba(255, 170, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            width: 175px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .title-badge {
            font-size: 0.68rem;
            color: #ffaa00;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .phase-text {
            font-size: 0.65rem;
            color: #ffffff;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 6px #ffaa00;
        }

        .status-indicators {
            display: flex;
            justify-content: space-around;
            padding: 2px 0;
        }

        .dot-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .dot-label {
            font-size: 0.55rem;
            color: #888888;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #ff3330;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3330;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 170, 0, 0.2);
            border-radius: 50%;
            border-top-color: #ffaa00;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <!-- MediaPipe Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <video id="input-video" playsinline></video>
        <canvas id="output-canvas"></canvas>

        <div id="loading">
            <div class="spinner"></div>
            <p id="loading-text" style="font-size: 0.8rem; color: #ffaa00;">Channeling Mystic Multiverse Energy...</p>
        </div>

        <div id="ui-overlay">
            <div class="title-badge">Ancient One Spell</div>
            <div id="phase-display" class="phase-text">Phase: Waiting for Hands</div>
            
            <div class="status-indicators">
                <div class="dot-group">
                    <div id="status-dot" class="dot"></div>
                    <span class="dot-label">Track</span>
                </div>
                <div class="dot-group">
                    <div id="spell-dot" class="dot"></div>
                    <span class="dot-label">Cast</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * FIZONYX - The Ancient One Step-by-Step Spell Manifestation Engine
         * Stage 1: Line -> Stage 2: Circle -> Stage 3: Wheel Glyphs -> Stage 4: Square Lock Grid
         */

        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const statusDot = document.getElementById('status-dot');
        const spellDot = document.getElementById('spell-dot');
        const phaseDisplay = document.getElementById('phase-display');
        const loadingScreen = document.getElementById('loading');

        // Spell Progression States (0 = None, 1 = Vertical Beam, 2 = Spun Wheel, 3 = Mandala Core, 4 = Square Lock Array)
        let spellStage = 0;
        let lineLength = 0;
        let wheelRadius = 0;
        let squareScale = 0;
        let rotationAccumulator = 0;
        let lastAngle = null;
        let arrayRotation = 0;

        let spellOrigin = { x: 0, y: 0 };
        let handPrevDistance = null;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // High Speed Particle Engine
        class FieryParticleEngine {
            constructor(max = 1000) {
                this.particles = [];
                for (let i = 0; i < max; i++) {
                    this.particles.push({
                        x: 0, y: 0, vx: 0, vy: 0,
                        life: 0, size: 0, color: '#ffaa00', active: false
                    });
                }
            }

            spawn(x, y, count = 2) {
                let spawned = 0;
                for (let p of this.particles) {
                    if (!p.active) {
                        p.x = x + (Math.random() - 0.5) * 6;
                        p.y = y + (Math.random() - 0.5) * 6;
                        const ang = Math.random() * Math.PI * 2;
                        const spd = Math.random() * 4 + 1.5;
                        p.vx = Math.cos(ang) * spd;
                        p.vy = Math.sin(ang) * spd;
                        p.life = 1.0;
                        p.size = Math.random() * 3 + 1.5;
                        p.color = Math.random() > 0.4 ? '#ffaa00' : '#ffee77';
                        p.active = true;
                        spawned++;
                        if (spawned >= count) break;
                    }
                }
            }

            updateAndRender(ctx) {
                ctx.save();
                for (let p of this.particles) {
                    if (p.active) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life -= 0.04;

                        if (p.life <= 0) {
                            p.active = false;
                            continue;
                        }

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = '#ff5500';
                        ctx.globalAlpha = p.life;
                        ctx.fill();
                    }
                }
                ctx.restore();
            }
        }

        const sparks = new FieryParticleEngine();

        // 1. Stage 1: Vertical Beam / Line Drawing
        function drawVerticalBeam(ctx, cx, cy, len) {
            ctx.save();
            ctx.shadowColor = '#ff5500';
            ctx.shadowBlur = 20;

            const half = len / 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy - half);
            ctx.lineTo(cx, cy + half);
            ctx.strokeStyle = '#ff9900';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, cy - half);
            ctx.lineTo(cx, cy + half);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            sparks.spawn(cx, cy - half, 2);
            sparks.spawn(cx, cy + half, 2);
            ctx.restore();
        }

        // 2. Stage 2 & 3: Rotating Circles & Central Mandala Wheels
        function drawSpunWheel(ctx, cx, cy, radius, showInnerCore = false) {
            ctx.save();
            ctx.translate(cx, cy);

            arrayRotation += 0.035;

            ctx.shadowColor = '#ff6600';
            ctx.shadowBlur = 20;
            ctx.strokeStyle = '#ffaa00';
            ctx.lineWidth = 2.5;

            // Concentric Spun Rings
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.85, 0, Math.PI * 2);
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Inner Rotating Diamonds
            ctx.save();
            ctx.rotate(arrayRotation);
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 2;
            const side = radius * 1.1;
            for (let i = 0; i < 2; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.strokeRect(-side / 2, -side / 2, side, side);
            }
            ctx.restore();

            // Stage 3: Inner Sacred Geometry Satellites
            if (showInnerCore) {
                const satellites = 6;
                const satDist = radius * 0.72;
                const satRadius = radius * 0.22;

                for (let s = 0; s < satellites; s++) {
                    const angle = (s * 2 * Math.PI / satellites) + (arrayRotation * 0.8);
                    const sx = Math.cos(angle) * satDist;
                    const sy = Math.sin(angle) * satDist;

                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.rotate(-arrayRotation * 2);
                    ctx.beginPath();
                    ctx.arc(0, 0, satRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffee88';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    const sSide = satRadius * 1.1;
                    ctx.strokeRect(-sSide/2, -sSide/2, sSide, sSide);
                    ctx.restore();
                }

                // Center 6-Pointed Star
                ctx.save();
                ctx.rotate(-arrayRotation);
                for (let i = 0; i < 2; i++) {
                    ctx.rotate(Math.PI / 3);
                    ctx.beginPath();
                    for (let p = 0; p < 3; p++) {
                        const ang = (p * 2 * Math.PI / 3) - Math.PI / 2;
                        const px = Math.cos(ang) * (radius * 0.38);
                        const py = Math.sin(ang) * (radius * 0.38);
                        if (p === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.restore();
            }

            for (let i = 0; i < 2; i++) {
                const a = Math.random() * Math.PI * 2;
                sparks.spawn(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius, 1);
            }

            ctx.restore();
        }

        // 3. Stage 4: The Sudden Square Lock Grid Box (Ancient One Signature Finish)
        function drawSquareLockBox(ctx, cx, cy, size) {
            ctx.save();
            ctx.translate(cx, cy);

            ctx.shadowColor = '#ff4400';
            ctx.shadowBlur = 30;
            ctx.strokeStyle = '#ffbb00';
            ctx.lineWidth = 4;

            // Outer Radiant Boundary Box
            ctx.strokeRect(-size / 2, -size / 2, size, size);

            // Inner Offset Square Frame
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-size * 0.46, -size * 0.46, size * 0.92, size * 0.92);

            // 4 Corner Seals / Glyphs
            const half = size / 2;
            const corners = [
                [-half, -half], [half, -half],
                [half, half], [-half, half]
            ];

            corners.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffea00';
                ctx.shadowBlur = 15;
                ctx.fill();

                // Radiating Corner Diagonal Lines
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x * 0.7, y * 0.7);
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Diamond Square Grid inside Box
            ctx.save();
            ctx.rotate(Math.PI / 4);
            ctx.strokeStyle = '#ffaa00';
            ctx.lineWidth = 2.5;
            const diagSide = size * 0.707;
            ctx.strokeRect(-diagSide / 2, -diagSide / 2, diagSide, diagSide);
            ctx.restore();

            ctx.restore();
        }

        // Processing Pipeline
        function onResults(results) {
            if (loadingScreen.style.display !== 'none') {
                loadingScreen.style.display = 'none';
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDot.classList.add('active');

                // Draw Red/Cyan Joint Dots
                results.multiHandLandmarks.forEach((landmarks) => {
                    landmarks.forEach((lm, idx) => {
                        const px = lm.x * canvasElement.width;
                        const py = lm.y * canvasElement.height;
                        canvasCtx.beginPath();
                        canvasCtx.arc(px, py, [4, 8, 12, 16, 20].includes(idx) ? 5 : 3.5, 0, Math.PI * 2);
                        canvasCtx.fillStyle = [4, 8, 12, 16, 20].includes(idx) ? '#00ffff' : '#ff003c';
                        canvasCtx.shadowColor = '#00ffaa';
                        canvasCtx.shadowBlur = 6;
                        canvasCtx.fill();
                    });
                });

                if (results.multiHandLandmarks.length >= 2) {
                    const hand1 = results.multiHandLandmarks[0];
                    const hand2 = results.multiHandLandmarks[1];

                    const palm1 = { x: hand1[9].x * canvasElement.width, y: hand1[9].y * canvasElement.height };
                    const palm2 = { x: hand2[9].x * canvasElement.width, y: hand2[9].y * canvasElement.height };

                    const currentDistance = Math.hypot(palm1.x - palm2.x, palm1.y - palm2.y);
                    const currentCenter = { x: (palm1.x + palm2.x) / 2, y: (palm1.y + palm2.y) / 2 };

                    // 1. Stage 1: Hands Aligned Vertically (Drawing the Line)
                    const isVertical = Math.abs(palm1.x - palm2.x) < 90 && Math.abs(palm1.y - palm2.y) > 120;
                    
                    if (isVertical && spellStage === 0) {
                        spellStage = 1;
                        spellOrigin = currentCenter;
                        lineLength = Math.abs(palm1.y - palm2.y);
                    }

                    // 2. Stage 2 & 3: Rotating Hands around center
                    const curAngle = Math.atan2(palm2.y - spellOrigin.y, palm2.x - spellOrigin.x);

                    if (spellStage >= 1 && spellStage < 4) {
                        if (lastAngle !== null) {
                            let delta = curAngle - lastAngle;
                            if (delta > Math.PI) delta -= Math.PI * 2;
                            if (delta < -Math.PI) delta += Math.PI * 2;
                            rotationAccumulator += Math.abs(delta);

                            if (rotationAccumulator > 1.2 && spellStage === 1) {
                                spellStage = 2; // Spun into Wheel
                            }
                            if (rotationAccumulator > 3.5 && spellStage === 2) {
                                spellStage = 3; // Wheel Expanded with Inner Satellites
                            }
                        }
                        lastAngle = curAngle;
                        wheelRadius = Math.min(240, 50 + rotationAccumulator * 35);
                    }

                    // 3. Stage 4: Sudden Push Apart Gesture (రెండు చేతులు సడన్‌గా విడదీయడం)
                    if (handPrevDistance !== null && spellStage >= 2) {
                        const separationSpeed = currentDistance - handPrevDistance;
                        if (separationSpeed > 35 && currentDistance > 280) {
                            spellStage = 4; // Manifest Square Lock Box Array
                            squareScale = Math.min(480, currentDistance * 1.3);
                        }
                    }
                    handPrevDistance = currentDistance;

                    // Update Status HUD
                    spellDot.classList.add('active');
                    if (spellStage === 1) phaseDisplay.innerText = "Phase 1: Vertical Beam";
                    else if (spellStage === 2) phaseDisplay.innerText = "Phase 2: Spun Wheel";
                    else if (spellStage === 3) phaseDisplay.innerText = "Phase 3: Sacred Mandala";
                    else if (spellStage === 4) phaseDisplay.innerText = "Phase 4: Square Locked!";

                    // Render Step-by-Step Magic
                    if (spellStage === 1) {
                        drawVerticalBeam(canvasCtx, spellOrigin.x, spellOrigin.y, lineLength);
                    } else if (spellStage === 2) {
                        drawSpunWheel(canvasCtx, spellOrigin.x, spellOrigin.y, wheelRadius, false);
                    } else if (spellStage === 3) {
                        drawSpunWheel(canvasCtx, spellOrigin.x, spellOrigin.y, wheelRadius, true);
                    } else if (spellStage === 4) {
                        drawSpunWheel(canvasCtx, currentCenter.x, currentCenter.y, 220, true);
                        drawSquareLockBox(canvasCtx, currentCenter.x, currentCenter.y, squareScale);
                    }
                } else {
                    lastAngle = null;
                    handPrevDistance = null;
                    // Reset if hands disappear
                    if (spellStage !== 4) {
                        spellStage = 0;
                        rotationAccumulator = 0;
                        spellDot.classList.remove('active');
                        phaseDisplay.innerText = "Phase: Waiting for Hands";
                    }
                }
            } else {
                statusDot.classList.remove('active');
                spellDot.classList.remove('active');
                phaseDisplay.innerText = "Phase: Bring Hands into View";
            }

            sparks.updateAndRender(canvasCtx);
            canvasCtx.restore();
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.75
        });

        hands.onResults(onResults);

        // Camera Initialization
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().catch((err) => {
            console.error("Camera access error:", err);
            document.getElementById('loading-text').innerText = "Please allow camera access.";
        });
    </script>
</body>
</html>
