<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZONYX - The Ancient One Sacred Geometry AR Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: brightness(0.85) contrast(1.2);
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        /* Compact Top-Right Square HUD */
        #ui-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(10, 10, 15, 0.88);
            border: 1px solid rgba(255, 170, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            width: 165px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .title-badge {
            font-size: 0.7rem;
            color: #ffaa00;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
            text-shadow: 0 0 6px rgba(255, 170, 0, 0.6);
        }

        .status-indicators {
            display: flex;
            justify-content: space-around;
            padding: 2px 0;
        }

        .dot-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .dot-label {
            font-size: 0.58rem;
            color: #888888;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #ff3330;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3330;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
        }

        .btn {
            background: #181822;
            color: #dddddd;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn-ancient {
            background: linear-gradient(135deg, #774400, #ffaa00);
            border-color: #ffcc00;
            color: #000000;
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 3px solid rgba(255, 170, 0, 0.2);
            border-radius: 50%;
            border-top-color: #ffaa00;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <!-- MediaPipe Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <video id="input-video" playsinline></video>
        <canvas id="output-canvas"></canvas>

        <div id="loading">
            <div class="spinner"></div>
            <p id="loading-text" style="font-size: 0.85rem; color: #ffaa00;">Initializing Ancient One Sorcery...</p>
        </div>

        <div id="ui-overlay">
            <div class="title-badge">Ancient Sorcery</div>
            
            <div class="status-indicators">
                <div class="dot-group">
                    <div id="status-dot" class="dot"></div>
                    <span class="dot-label">Hand</span>
                </div>
                <div class="dot-group">
                    <div id="spell-dot" class="dot"></div>
                    <span class="dot-label">Spell</span>
                </div>
            </div>

            <div class="controls-grid">
                <button class="btn btn-ancient" onclick="toggleAncientShield()">Toggle Array</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * FIZONYX Senior Software Engineering Team
         * The Ancient One Complex Geometry Array & Motion Spell Engine
         */

        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const statusDot = document.getElementById('status-dot');
        const spellDot = document.getElementById('spell-dot');
        const loadingScreen = document.getElementById('loading');

        let isAncientShieldActive = false;
        let manualShieldTimer = null;
        let arrayRotation = 0;
        let arrayScale = 0;

        // Fingertip drawing trails
        const fingerTrails = [];
        const MAX_TRAIL = 20;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function toggleAncientShield() {
            isAncientShieldActive = !isAncientShieldActive;
            if (isAncientShieldActive) {
                spellDot.classList.add('active');
                if (manualShieldTimer) clearTimeout(manualShieldTimer);
                manualShieldTimer = setTimeout(() => {
                    isAncientShieldActive = false;
                    spellDot.classList.remove('active');
                }, 10000);
            } else {
                spellDot.classList.remove('active');
            }
        }

        // Particle System for Fiery Mandala Sparks
        class EldritchSparks {
            constructor(max = 800) {
                this.particles = [];
                for (let i = 0; i < max; i++) {
                    this.particles.push({
                        x: 0, y: 0, vx: 0, vy: 0,
                        life: 0, size: 0, color: '#ffaa00', active: false
                    });
                }
            }

            spawn(x, y, count = 2) {
                let spawned = 0;
                for (let p of this.particles) {
                    if (!p.active) {
                        p.x = x + (Math.random() - 0.5) * 8;
                        p.y = y + (Math.random() - 0.5) * 8;
                        const ang = Math.random() * Math.PI * 2;
                        const spd = Math.random() * 4 + 1.5;
                        p.vx = Math.cos(ang) * spd;
                        p.vy = Math.sin(ang) * spd;
                        p.life = 1.0;
                        p.size = Math.random() * 3 + 1.5;
                        p.color = Math.random() > 0.3 ? '#ffaa00' : '#ffee88';
                        p.active = true;
                        spawned++;
                        if (spawned >= count) break;
                    }
                }
            }

            updateAndRender(ctx) {
                ctx.save();
                for (let p of this.particles) {
                    if (p.active) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life -= 0.035;

                        if (p.life <= 0) {
                            p.active = false;
                            continue;
                        }

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = '#ff6600';
                        ctx.globalAlpha = p.life;
                        ctx.fill();
                    }
                }
                ctx.restore();
            }
        }

        const sparkEngine = new EldritchSparks();

        // 1. Draw Fiery Motion Trails (Ancient One Drawing Lines Gesture)
        function renderFingerTrails(ctx, points) {
            if (points.length < 2) return;
            ctx.save();
            ctx.shadowColor = '#ff6600';
            ctx.shadowBlur = 15;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let i = 1; i < points.length; i++) {
                const alpha = i / points.length;
                ctx.beginPath();
                ctx.moveTo(points[i - 1].x, points[i - 1].y);
                ctx.lineTo(points[i].x, points[i].y);
                ctx.strokeStyle = `rgba(255, 170, 0, ${alpha})`;
                ctx.lineWidth = alpha * 6;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 2. Sub-Mandala Renderer (for the outer 6 surrounding circles)
        function drawSatelliteMandala(ctx, x, y, r, rot) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);

            ctx.strokeStyle = '#ffaa00';
            ctx.shadowColor = '#ff5500';
            ctx.shadowBlur = 10;
            ctx.lineWidth = 1.5;

            // Outer Ring
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.stroke();

            // Inner Star/Square
            const side = r * 1.1;
            ctx.strokeRect(-side / 2, -side / 2, side, side);
            ctx.rotate(Math.PI / 4);
            ctx.strokeRect(-side / 2, -side / 2, side, side);

            // Center Point
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.restore();
        }

        // 3. The Ancient One Sacred Geometry Array (Master Multiverse Shield)
        function renderAncientOneArray(ctx, cx, cy, radius) {
            ctx.save();
            ctx.translate(cx, cy);

            arrayRotation += 0.02;

            ctx.shadowColor = '#ff6600';
            ctx.shadowBlur = 25;
            ctx.strokeStyle = '#ffaa00';
            ctx.lineWidth = 2.5;

            // Grand Outer Ring
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.stroke();

            // Secondary Intersecting Perimeter Ring
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.82, 0, Math.PI * 2);
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Large Interlocking Diamonds / 8-Pointed Star
            ctx.save();
            ctx.rotate(arrayRotation);
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 2;
            const bigSide = radius * 1.15;
            for (let i = 0; i < 2; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.strokeRect(-bigSide / 2, -bigSide / 2, bigSide, bigSide);
            }
            ctx.restore();

            // Central Sacred Core
            ctx.save();
            ctx.rotate(-arrayRotation * 1.5);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.45, 0, Math.PI * 2);
            ctx.stroke();

            // 6-Pointed Star inside Core
            ctx.strokeStyle = '#ffeeaa';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 2; i++) {
                ctx.rotate(Math.PI / 3);
                ctx.beginPath();
                for (let p = 0; p < 3; p++) {
                    const ang = (p * 2 * Math.PI / 3) - Math.PI / 2;
                    const px = Math.cos(ang) * (radius * 0.42);
                    const py = Math.sin(ang) * (radius * 0.42);
                    if (p === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }
            ctx.restore();

            // 6 Outer Surrounding Satellite Mandalas (as seen in the movie scene)
            const numSatellites = 6;
            const satelliteDist = radius * 0.72;
            const satelliteRadius = radius * 0.22;

            for (let s = 0; s < numSatellites; s++) {
                const angle = (s * 2 * Math.PI / numSatellites) + (arrayRotation * 0.6);
                const sx = Math.cos(angle) * satelliteDist;
                const sy = Math.sin(angle) * satelliteDist;

                drawSatelliteMandala(ctx, sx, sy, satelliteRadius, -arrayRotation * 2);

                // Connecting Web Lines from Center to Satellites
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(sx, sy);
                ctx.strokeStyle = 'rgba(255, 170, 0, 0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Spawn sparks at center and perimeter
            sparkEngine.spawn(cx, cy, 3);
            for (let i = 0; i < 3; i++) {
                const a = Math.random() * Math.PI * 2;
                sparkEngine.spawn(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius, 1);
            }

            ctx.restore();
        }

        // Processing Pipeline
        function onResults(results) {
            if (loadingScreen.style.display !== 'none') {
                loadingScreen.style.display = 'none';
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDot.classList.add('active');

                // Render Tracking Dots
                results.multiHandLandmarks.forEach((landmarks) => {
                    landmarks.forEach((lm, idx) => {
                        const px = lm.x * canvasElement.width;
                        const py = lm.y * canvasElement.height;
                        canvasCtx.beginPath();
                        canvasCtx.arc(px, py, [4, 8, 12, 16, 20].includes(idx) ? 5 : 3.5, 0, Math.PI * 2);
                        canvasCtx.fillStyle = [4, 8, 12, 16, 20].includes(idx) ? '#00ffff' : '#ff003c';
                        canvasCtx.shadowColor = '#00ffaa';
                        canvasCtx.shadowBlur = 6;
                        canvasCtx.fill();
                    });
                });

                // Fingertip drawing trail on leading hand
                const leadIndex = {
                    x: results.multiHandLandmarks[0][8].x * canvasElement.width,
                    y: results.multiHandLandmarks[0][8].y * canvasElement.height
                };
                fingerTrails.push(leadIndex);
                if (fingerTrails.length > MAX_TRAIL) fingerTrails.shift();
                renderFingerTrails(canvasCtx, fingerTrails);

                // Two-Hand Gesture Detection for Array Spell
                if (results.multiHandLandmarks.length >= 2) {
                    const hand1 = results.multiHandLandmarks[0];
                    const hand2 = results.multiHandLandmarks[1];

                    const palm1 = { x: hand1[9].x * canvasElement.width, y: hand1[9].y * canvasElement.height };
                    const palm2 = { x: hand2[9].x * canvasElement.width, y: hand2[9].y * canvasElement.height };

                    const handDistance = Math.hypot(palm1.x - palm2.x, palm1.y - palm2.y);
                    const midPoint = { x: (palm1.x + palm2.x) / 2, y: (palm1.y + palm2.y) / 2 };

                    // Open Stance / Palms Apart (Ancient One Manifestation Pose)
                    const isHandsSpread = handDistance > 200 && handDistance < 600;

                    if (isHandsSpread || isAncientShieldActive) {
                        spellDot.classList.add('active');
                        arrayScale += (Math.min(320, handDistance * 0.85) - arrayScale) * 0.1;
                        renderAncientOneArray(canvasCtx, midPoint.x, midPoint.y, arrayScale);
                    } else {
                        arrayScale += (0 - arrayScale) * 0.15;
                        if (!isAncientShieldActive) spellDot.classList.remove('active');
                    }
                } else if (isAncientShieldActive) {
                    const palm = {
                        x: results.multiHandLandmarks[0][9].x * canvasElement.width,
                        y: results.multiHandLandmarks[0][9].y * canvasElement.height
                    };
                    renderAncientOneArray(canvasCtx, palm.x, palm.y, 220);
                }
            } else {
                statusDot.classList.remove('active');
                fingerTrails.length = 0;
            }

            sparkEngine.updateAndRender(canvasCtx);
            canvasCtx.restore();
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.75
        });

        hands.onResults(onResults);

        // Camera Initialization
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().catch((err) => {
            console.error("Camera access error:", err);
            document.getElementById('loading-text').innerText = "Please allow camera access.";
        });
    </script>
</body>
</html>
