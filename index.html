<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZONYX - Doctor Strange AR Engine V7 (Darkhold & Damned Cloak)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: brightness(0.85) contrast(1.2);
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        /* Compact Top-Right Mini HUD */
        #ui-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid rgba(255, 50, 50, 0.5);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            width: 175px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hud-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 4px;
        }

        .hud-title {
            font-size: 0.75rem;
            color: #ff3344;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .hud-btn {
            background: rgba(25, 25, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ddd;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 5px 2px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .hud-btn:hover {
            border-color: #ff3344;
            color: #fff;
        }

        .hud-btn.active {
            background: #ff2233;
            color: #000;
            border-color: #ff5566;
            box-shadow: 0 0 8px #ff2233;
        }

        .hud-btn.orange-active {
            background: #ff9900;
            color: #000;
            border-color: #ffaa00;
            box-shadow: 0 0 8px #ff9900;
        }

        .hud-btn.green-active {
            background: #00ff88;
            color: #000;
            border-color: #00ffaa;
            box-shadow: 0 0 8px #00ff88;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 50, 50, 0.2);
            border-radius: 50%;
            border-top-color: #ff2233;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <video id="input-video" playsinline></video>
        <canvas id="output-canvas"></canvas>

        <div id="loading">
            <div class="spinner"></div>
            <p id="loading-text" style="font-size: 0.85rem; color: #ff3344;">Summoning Darkhold Realm V7...</p>
        </div>

        <div id="ui-overlay">
            <div class="hud-header">
                <span class="hud-title">FIZONYX V7</span>
                <div id="status-dot" class="status-dot"></div>
            </div>
            
            <div class="btn-grid">
                <button id="btn-orange" class="hud-btn" onclick="toggleEffect('orange')">Eldritch</button>
                <button id="btn-time" class="hud-btn" onclick="toggleEffect('time')">Time</button>
                <button id="btn-darkhold" class="hud-btn" onclick="toggleEffect('darkhold')">Chaos Orb</button>
                <button id="btn-cloak" class="hud-btn" onclick="toggleEffect('cloak')">Damned Cloak</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * FIZONYX Senior Software Engineering Team
         * Doctor Strange AR Engine - Version 7 (Darkhold & Cloak of Damned Integration)
         */

        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusDot = document.getElementById('status-dot');
        const loadingScreen = document.getElementById('loading');

        // State Machine
        let activeShieldType = null;
        let isDarkholdActive = false;
        let isCloakActive = false;

        let portalRadius = 0;
        let targetPortalRadius = 0;
        let totalRotation = 0;
        let lastAngle = null;

        // Shield Rotation Trackers
        let rotSlowCW = 0;
        let rotFastCW = 0;
        let rotSlowCCW = 0;
        let rotFastCCW = 0;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function toggleEffect(type) {
            if (type === 'orange') {
                activeShieldType = (activeShieldType === 'orange') ? null : 'orange';
            } else if (type === 'time') {
                activeShieldType = (activeShieldType === 'time') ? null : 'time';
            } else if (type === 'darkhold') {
                isDarkholdActive = !isDarkholdActive;
            } else if (type === 'cloak') {
                isCloakActive = !isCloakActive;
            }
            updateButtonUI();
        }

        function updateButtonUI() {
            document.getElementById('btn-orange').className = 'hud-btn' + (activeShieldType === 'orange' ? ' orange-active' : '');
            document.getElementById('btn-time').className = 'hud-btn' + (activeShieldType === 'time' ? ' green-active' : '');
            document.getElementById('btn-darkhold').className = 'hud-btn' + (isDarkholdActive ? ' active' : '');
            document.getElementById('btn-cloak').className = 'hud-btn' + (isCloakActive ? ' active' : '');
        }

        // --- PARTICLE SYSTEM ---
        class UnifiedParticleSystem {
            constructor(max = 1200) {
                this.particles = [];
                for (let i = 0; i < max; i++) {
                    this.particles.push({
                        x: 0, y: 0, vx: 0, vy: 0,
                        life: 0, size: 0, color: '#ff0033',
                        mode: 'chaos', active: false
                    });
                }
            }

            spawn(x, y, count = 2, mode = 'chaos') {
                let spawned = 0;
                for (let p of this.particles) {
                    if (!p.active) {
                        p.x = x + (Math.random() - 0.5) * 16;
                        p.y = y + (Math.random() - 0.5) * 16;
                        const ang = Math.random() * Math.PI * 2;
                        const spd = Math.random() * 4 + 1.5;
                        p.vx = Math.cos(ang) * spd;
                        p.vy = Math.sin(ang) * spd;
                        p.life = 1.0;
                        p.mode = mode;

                        if (mode === 'chaos') {
                            p.size = Math.random() * 6 + 3;
                            p.color = Math.random() > 0.4 ? '#ff1122' : '#220005';
                        } else if (mode === 'green') {
                            p.size = Math.random() * 3 + 1.5;
                            p.color = Math.random() > 0.3 ? '#00ff88' : '#e0fffa';
                        } else if (mode === 'portal') {
                            p.size = Math.random() * 3 + 1.5;
                            p.color = Math.random() > 0.5 ? '#ffaa00' : '#ff3300';
                        }

                        p.active = true;
                        spawned++;
                        if (spawned >= count) break;
                    }
                }
            }

            updateAndRender(ctx) {
                ctx.save();
                for (let p of this.particles) {
                    if (p.active) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life -= (p.mode === 'chaos' ? 0.025 : 0.04);

                        if (p.life <= 0) {
                            p.active = false;
                            continue;
                        }

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        if (p.mode === 'chaos') {
                            ctx.shadowBlur = 12;
                            ctx.shadowColor = '#ff0033';
                        } else {
                            ctx.shadowBlur = 6;
                            ctx.shadowColor = p.color;
                        }
                        ctx.globalAlpha = p.life;
                        ctx.fill();
                    }
                }
                ctx.restore();
            }
        }

        const particleEngine = new UnifiedParticleSystem();

        // --- 1. CLOAK OF THE DAMNED (DEMONIC HANDS WINGS) ---
        function renderCloakOfTheDamned(ctx, spineBase, scale) {
            ctx.save();
            ctx.translate(spineBase.x, spineBase.y);

            const time = Date.now() * 0.003;
            const armCount = 7; // Arms per side

            // Render Shadowy Tendrils / Demonic Skeletal Arms
            for (let side = -1; side <= 1; side += 2) {
                for (let i = 0; i < armCount; i++) {
                    ctx.save();
                    const baseAngle = (side * (0.3 + i * 0.22)) + Math.sin(time + i) * 0.08;
                    const armLength = (scale * 2.2) * (0.65 + (i / armCount) * 0.5);

                    ctx.rotate(baseAngle - Math.PI / 2);

                    // Demonic Arm Joint 1
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    const j1x = armLength * 0.45;
                    const j1y = Math.sin(time * 2 + i) * 15;
                    const hx = armLength;
                    const hy = Math.sin(time * 2 + i + 1) * 25;

                    ctx.quadraticCurveTo(j1x, j1y, hx, hy);
                    ctx.strokeStyle = '#050205';
                    ctx.lineWidth = 14 * (1 - i / (armCount + 2));
                    ctx.shadowColor = '#ff0022';
                    ctx.shadowBlur = 20;
                    ctx.stroke();

                    // Inner Malice Core Red Line
                    ctx.strokeStyle = 'rgba(255, 0, 50, 0.8)';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Skeletal Claws / Hands at end of each arm
                    ctx.translate(hx, hy);
                    ctx.rotate(Math.sin(time * 3 + i) * 0.2);
                    for (let f = -2; f <= 2; f++) {
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        const fx = 25 * Math.cos(f * 0.35);
                        const fy = 25 * Math.sin(f * 0.35);
                        ctx.lineTo(fx, fy);
                        ctx.strokeStyle = '#080208';
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        ctx.strokeStyle = '#ff1133';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }

                    ctx.restore();
                }
            }

            // Central Dark Void Smoke Base
            const smokeGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, scale * 1.4);
            smokeGrad.addColorStop(0, 'rgba(0,0,0,0.95)');
            smokeGrad.addColorStop(0.6, 'rgba(40,0,10,0.6)');
            smokeGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = smokeGrad;
            ctx.beginPath();
            ctx.arc(0, 0, scale * 1.4, 0, Math.PI * 2);
            ctx.fill();

            particleEngine.spawn(spineBase.x, spineBase.y, 3, 'chaos');
            ctx.restore();
        }

        // --- 2. DARKHOLD CHAOS MAGIC ORBS ---
        function renderDarkholdChaosOrbs(ctx, centerX, centerY, scale) {
            ctx.save();
            const time = Date.now() * 0.0025;
            const orbCount = 6;
            const orbitRadius = scale * 1.6;

            for (let i = 0; i < orbCount; i++) {
                const angle = (i * (Math.PI * 2 / orbCount)) + time;
                const ox = centerX + Math.cos(angle) * orbitRadius;
                const oy = centerY + Math.sin(angle * 1.5) * (orbitRadius * 0.65);
                const orbSize = 16 + Math.sin(time * 3 + i) * 4;

                // Dark Energy Smoke Core
                const orbGrad = ctx.createRadialGradient(ox, oy, 2, ox, oy, orbSize * 1.8);
                orbGrad.addColorStop(0, '#ffffff');
                orbGrad.addColorStop(0.25, '#ff0033');
                orbGrad.addColorStop(0.7, '#2b0008');
                orbGrad.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.arc(ox, oy, orbSize * 1.8, 0, Math.PI * 2);
                ctx.fillStyle = orbGrad;
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 25;
                ctx.fill();

                // Tendril Streams connecting Orbs
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.quadraticCurveTo(
                    centerX + (Math.random() - 0.5) * 30,
                    centerY + (Math.random() - 0.5) * 30,
                    ox, oy
                );
                ctx.strokeStyle = 'rgba(255, 0, 50, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                particleEngine.spawn(ox, oy, 2, 'chaos');
            }
            ctx.restore();
        }

        // --- 3. MULTI-LAYER ELDRITCH / TIME SHIELD ---
        function drawMultiLayerShield(ctx, x, y, radius, isGreen = false) {
            ctx.save();
            ctx.translate(x, y);

            rotSlowCW += 0.01;
            rotFastCW += 0.035;
            rotSlowCCW -= 0.008;
            rotFastCCW -= 0.025;

            const baseColor = isGreen ? '#00ff88' : '#ff6a00';
            const brightColor = isGreen ? '#e0fffa' : '#ffcc00';
            const shadowClr = isGreen ? '#00ff44' : '#ff4400';
            const scale = radius / 285;

            function circle(r, stroke, lw, dash = null) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, r * scale, 0, Math.PI * 2);
                ctx.strokeStyle = stroke;
                ctx.lineWidth = lw;
                ctx.shadowColor = shadowClr;
                ctx.shadowBlur = 12;
                if (dash) ctx.setLineDash(dash);
                ctx.stroke();
                ctx.restore();
            }

            function drawEquilateral(r, rotOffset = 0) {
                ctx.save();
                ctx.rotate(rotOffset);
                ctx.beginPath();
                for (let i = 0; i < 3; i++) {
                    const ang = (i * 2 * Math.PI / 3) - Math.PI / 2;
                    const px = Math.cos(ang) * (r * scale);
                    const py = Math.sin(ang) * (r * scale);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // Layer 1
            ctx.save();
            ctx.rotate(rotSlowCW);
            circle(8, brightColor, 3);
            circle(35, baseColor, 2);
            circle(60, brightColor, 2.5, [8, 12]);
            const sqSide = 120 * scale;
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(-sqSide/2, -sqSide/2, sqSide, sqSide);
            ctx.rotate(Math.PI / 4);
            ctx.strokeRect(-sqSide/2, -sqSide/2, sqSide, sqSide);
            ctx.restore();

            // Layer 2
            ctx.save();
            ctx.rotate(rotFastCCW);
            circle(110, baseColor, 4);
            circle(140, baseColor, 2, [8, 12]);
            ctx.strokeStyle = brightColor;
            ctx.lineWidth = 2.5;
            drawEquilateral(140, 0);
            drawEquilateral(140, Math.PI);
            ctx.beginPath();
            ctx.moveTo(-140 * scale, 0); ctx.lineTo(140 * scale, 0);
            ctx.moveTo(0, -140 * scale); ctx.lineTo(0, 140 * scale);
            ctx.stroke();
            ctx.restore();

            // Layer 3
            ctx.save();
            ctx.rotate(rotFastCW);
            circle(185, baseColor, 4);
            circle(225, baseColor, 3, [3, 15]);
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 2;
            drawEquilateral(190, 0.26);
            drawEquilateral(190, 2.35);
            drawEquilateral(190, 4.45);
            ctx.restore();

            // Layer 4
            ctx.save();
            ctx.rotate(rotSlowCCW);
            circle(260, brightColor, 4);
            circle(275, baseColor, 2, [8, 12]);
            circle(285, baseColor, 2);
            ctx.restore();

            ctx.restore();
        }

        // --- 4. COSMIC SPACE PORTAL ---
        function renderCosmicPortal(ctx, x, y, radius) {
            if (radius < 15) return;
            ctx.save();

            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius * 0.78, 0, Math.PI * 2);
            ctx.clip();

            ctx.fillStyle = '#020008';
            ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);

            const grad = ctx.createRadialGradient(x, y, 5, x, y, radius * 0.78);
            grad.addColorStop(0, 'rgba(120, 0, 255, 0.6)');
            grad.addColorStop(0.5, 'rgba(0, 200, 255, 0.3)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0.9)');
            ctx.fillStyle = grad;
            ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);

            const time = Date.now() * 0.002;
            for (let i = 0; i < 25; i++) {
                const starAngle = i * 137.5;
                const starDist = ((i * 13 + time * 20) % (radius * 0.72));
                const sx = x + Math.cos(starAngle) * starDist;
                const sy = y + Math.sin(starAngle) * starDist;

                ctx.beginPath();
                ctx.arc(sx, sy, (i % 3) + 1, 0, Math.PI * 2);
                ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#ffd700';
                ctx.fill();
            }
            ctx.restore();

            ctx.beginPath();
            ctx.arc(x, y, radius * 0.8, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 15;
            ctx.stroke();

            particleEngine.spawn(x, y, 3, 'portal');
            ctx.restore();
        }

        // --- 5. 5-FINGER WHIPS ---
        function renderFiveFingerWhips(ctx, hand1, hand2) {
            const pairs = [4, 8, 12, 16, 20];
            pairs.forEach((fingerIdx, idx) => {
                const p1 = { x: hand1[fingerIdx].x * canvasElement.width, y: hand1[fingerIdx].y * canvasElement.height };
                const p2 = { x: hand2[fingerIdx].x * canvasElement.width, y: hand2[fingerIdx].y * canvasElement.height };

                ctx.save();
                ctx.shadowColor = '#ff6600';
                ctx.shadowBlur = 16;
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2 + (idx * 12 + 18);

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 4 - idx * 0.35;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            });
        }

        // Frame Processing
        function onResults(results) {
            if (loadingScreen.style.display !== 'none') {
                loadingScreen.style.display = 'none';
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDot.classList.add('active');

                // Render Joint Dots
                results.multiHandLandmarks.forEach((landmarks) => {
                    landmarks.forEach((lm, idx) => {
                        const px = lm.x * canvasElement.width;
                        const py = lm.y * canvasElement.height;
                        canvasCtx.beginPath();
                        canvasCtx.arc(px, py, [4, 8, 12, 16, 20].includes(idx) ? 4.5 : 3, 0, Math.PI * 2);
                        canvasCtx.fillStyle = [4, 8, 12, 16, 20].includes(idx) ? '#00ffff' : '#ff003c';
                        canvasCtx.shadowColor = '#00ffaa';
                        canvasCtx.shadowBlur = 5;
                        canvasCtx.fill();
                    });
                });

                // Calculate Spine / Center Reference
                const wrist0 = results.multiHandLandmarks[0][0];
                const centerRef = {
                    x: wrist0.x * canvasElement.width,
                    y: (wrist0.y * canvasElement.height) + 120
                };

                // Render Demonic Cloak of the Damned
                if (isCloakActive) {
                    renderCloakOfTheDamned(canvasCtx, centerRef, 160);
                }

                // Render Darkhold Chaos Magic Orbs
                if (isDarkholdActive) {
                    renderDarkholdChaosOrbs(canvasCtx, centerRef.x, centerRef.y - 80, 140);
                }

                if (results.multiHandLandmarks.length >= 2) {
                    const hand1 = results.multiHandLandmarks[0];
                    const hand2 = results.multiHandLandmarks[1];

                    // Sling Ring Portal Check
                    const isSlingPose = hand1[8].y < hand1[6].y && hand1[12].y < hand1[10].y && hand1[16].y > hand1[14].y;
                    if (isSlingPose) {
                        const portalCenter = { x: hand1[9].x * canvasElement.width, y: hand1[9].y * canvasElement.height };
                        const rotatingTip = { x: hand2[8].x * canvasElement.width, y: hand2[8].y * canvasElement.height };
                        const currentAngle = Math.atan2(rotatingTip.y - portalCenter.y, rotatingTip.x - portalCenter.x);

                        if (lastAngle !== null) {
                            let delta = currentAngle - lastAngle;
                            if (delta > Math.PI) delta -= Math.PI * 2;
                            if (delta < -Math.PI) delta += Math.PI * 2;
                            totalRotation += Math.abs(delta);
                            targetPortalRadius = Math.min(340, Math.max(50, totalRotation * 22));
                        }
                        lastAngle = currentAngle;
                        portalRadius += (targetPortalRadius - portalRadius) * 0.12;
                        renderCosmicPortal(canvasCtx, portalCenter.x, portalCenter.y, portalRadius);
                    } else {
                        lastAngle = null;
                        totalRotation = Math.max(0, totalRotation - 0.05);
                        portalRadius += (0 - portalRadius) * 0.12;
                        renderFiveFingerWhips(canvasCtx, hand1, hand2);
                    }
                } else {
                    lastAngle = null;
                }

                // Render Shields
                if (activeShieldType) {
                    results.multiHandLandmarks.forEach((landmarks) => {
                        const palmCenter = { x: landmarks[9].x * canvasElement.width, y: landmarks[9].y * canvasElement.height };
                        const wrist = { x: landmarks[0].x * canvasElement.width, y: landmarks[0].y * canvasElement.height };
                        const handScale = Math.hypot(palmCenter.x - wrist.x, palmCenter.y - wrist.y);
                        drawMultiLayerShield(canvasCtx, palmCenter.x, palmCenter.y, handScale * 2.1, activeShieldType === 'time');
                    });
                }
            } else {
                statusDot.classList.remove('active');
                lastAngle = null;
            }

            particleEngine.updateAndRender(canvasCtx);
            canvasCtx.restore();
        }

        // Initialize MediaPipe
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.75
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().catch((err) => {
            console.error("Camera access failed:", err);
            document.getElementById('loading-text').innerText = "Camera Access Failed.";
        });
    </script>
</body>
</html>
