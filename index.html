<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Kusuma!</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe Hands and Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- Canvas Confetti for Birthday Effects -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    .glow-text {
      text-shadow: 0 0 10px rgba(255, 20, 147, 0.8),
                   0 0 20px rgba(255, 105, 180, 0.8),
                   0 0 40px rgba(255, 0, 128, 0.9),
                   0 0 70px rgba(255, 0, 128, 1);
    }
    #webcam, #output-canvas {
      transform: scaleX(-1);
    }
  </style>
</head>
<body class="bg-gray-950 text-white overflow-hidden select-none font-sans">

  <div class="relative w-screen h-screen flex items-center justify-center">
    
    <video id="webcam" class="hidden" playsinline autoplay></video>
    <canvas id="output-canvas" class="absolute inset-0 w-full h-full object-cover z-0"></canvas>

    <!-- Instructions -->
    <div id="instructions" class="absolute top-6 left-1/2 -translate-x-1/2 z-20 bg-black/60 backdrop-blur-md px-6 py-3 rounded-full border border-pink-500/30 text-center shadow-lg">
      <p class="text-sm md:text-base font-semibold text-pink-300">
        ✨ కెమెరా ముందు 2 చేతులు ఉంచి దూరం జరపండి ✨
      </p>
    </div>

    <!-- Dynamic Text Container (No Line) -->
    <div id="text-container" class="absolute z-10 pointer-events-none flex flex-col items-center justify-center opacity-0 transition-opacity duration-150">
      <h1 id="bday-main-text" class="glow-text font-black tracking-wider text-center text-pink-400 whitespace-nowrap drop-shadow-2xl">
        🎉 HAPPY BIRTHDAY 🎉
      </h1>
      <h2 id="bday-name-text" class="glow-text font-bold tracking-widest text-center text-yellow-300 whitespace-nowrap mt-2">
        KUSUMA ❤️
      </h2>
    </div>

    <!-- Loading -->
    <div id="loading" class="absolute z-30 flex flex-col items-center gap-3">
      <div class="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-pink-300 font-medium tracking-wide">ఫాస్ట్ మోడ్ లోడ్ అవుతోంది...</p>
    </div>

  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const textContainer = document.getElementById('text-container');
    const bdayMainText = document.getElementById('bday-main-text');
    const bdayNameText = document.getElementById('bday-name-text');
    const loadingElement = document.getElementById('loading');

    let confettiTriggered = false;

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function shootConfetti() {
      confetti({
        particleCount: 90,
        spread: 120,
        origin: { y: 0.6 }
      });
    }

    function onResults(results) {
      if (loadingElement.style.display !== 'none') {
        loadingElement.style.display = 'none';
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
        const hand1 = results.multiHandLandmarks[0];
        const hand2 = results.multiHandLandmarks[1];

        const p1 = hand1[9]; // Middle finger MCP / Center of palm
        const p2 = hand2[9];

        const x1 = (1 - p1.x) * window.innerWidth;
        const y1 = p1.y * window.innerHeight;
        const x2 = (1 - p2.x) * window.innerWidth;
        const y2 = p2.y * window.innerHeight;

        const dx = x2 - x1;
        const dy = y2 - y1;
        const distance = Math.sqrt(dx * dx + dy * dy);

        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;

        // Dynamic size mapping based on distance
        const baseSize = Math.max(18, Math.min(distance * 0.15, 100));
        const nameSize = baseSize * 0.75;

        textContainer.style.left = `${midX}px`;
        textContainer.style.top = `${midY}px`;
        textContainer.style.transform = `translate(-50%, -50%)`;
        textContainer.style.opacity = '1';

        bdayMainText.style.fontSize = `${baseSize}px`;
        bdayNameText.style.fontSize = `${nameSize}px`;

        // Confetti trigger on wide distance
        if (distance > window.innerWidth * 0.45 && !confettiTriggered) {
          shootConfetti();
          confettiTriggered = true;
          setTimeout(() => { confettiTriggered = false; }, 2000);
        }

      } else {
        textContainer.style.opacity = '0';
      }

      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    // Optimized for speed and performance
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0, // Set to 0 for lightning-fast performance
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,  // Lower resolution for high speed
      height: 480
    });

    camera.start().catch((err) => {
      console.error("Camera error:", err);
      loadingElement.innerHTML = `<p class="text-red-400 font-bold">కెమెరా పర్మిషన్ అవసరం!</p>`;
    });
  </script>
</body>
</html>
