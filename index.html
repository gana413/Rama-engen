<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZONYX - Doctor Strange AR Engine V7 (Darkhold Edition)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: brightness(0.85) contrast(1.2);
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        /* Compact Square UI at Top-Right Corner */
        #ui-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(10, 10, 15, 0.88);
            border: 1px solid rgba(255, 60, 60, 0.4);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            width: 160px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .title-badge {
            font-size: 0.72rem;
            color: #ff3344;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
            text-shadow: 0 0 6px rgba(255, 50, 50, 0.6);
        }

        .status-indicators {
            display: flex;
            justify-content: space-around;
            padding: 2px 0;
        }

        .dot-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .dot-label {
            font-size: 0.58rem;
            color: #888888;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #ff3330;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3330;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
        }

        .btn {
            background: #181822;
            color: #dddddd;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn-darkhold {
            background: linear-gradient(135deg, #44000b, #990022);
            border-color: #ff2255;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 0, 50, 0.4);
        }

        .btn-orange {
            background: linear-gradient(135deg, #663300, #ff8800);
            border-color: #ffaa00;
            color: #ffffff;
        }

        .btn-time {
            background: linear-gradient(135deg, #004422, #00bb66);
            border-color: #00ff88;
            color: #ffffff;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 3px solid rgba(255, 0, 60, 0.2);
            border-radius: 50%;
            border-top-color: #ff0044;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <video id="input-video" playsinline></video>
        <canvas id="output-canvas"></canvas>

        <div id="loading">
            <div class="spinner"></div>
            <p id="loading-text" style="font-size: 0.85rem; color: #ff3355;">Summoning Darkhold Magic V7...</p>
        </div>

        <div id="ui-overlay">
            <div class="title-badge">Sorcery V7</div>
            
            <div class="status-indicators">
                <div class="dot-group">
                    <div id="status-dot" class="dot"></div>
                    <span class="dot-label">Hand</span>
                </div>
                <div class="dot-group">
                    <div id="voice-dot" class="dot"></div>
                    <span class="dot-label">Voice</span>
                </div>
                <div class="dot-group">
                    <div id="dark-dot" class="dot"></div>
                    <span class="dot-label">Dark</span>
                </div>
            </div>

            <div class="controls-grid">
                <button class="btn btn-darkhold" onclick="toggleDarkhold()">Darkhold Cape</button>
                <button class="btn btn-orange" onclick="activateShield('orange')">Orange Shield</button>
                <button class="btn btn-time" onclick="activateShield('time')">Time Shield</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * FIZONYX Senior Software Engineering Team
         * Doctor Strange AR Engine V7 (Darkhold Multi-Arm Souls of the Damned & Multi-Spells)
         */

        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const statusDot = document.getElementById('status-dot');
        const voiceDot = document.getElementById('voice-dot');
        const darkDot = document.getElementById('dark-dot');
        const loadingScreen = document.getElementById('loading');

        // State Machine
        let activeShieldType = null;
        let shieldTimer = null;
        let isDarkholdActive = false;
        let darkholdTimer = null;
        let isVoiceListening = false;
        let speechRecognitionInstance = null;

        // Dynamic Portal States
        let portalRadius = 0;
        let targetPortalRadius = 0;
        let totalRotation = 0;
        let lastAngle = null;

        // Shield Rotations
        let rotSlowCW = 0;
        let rotFastCW = 0;
        let rotSlowCCW = 0;
        let rotFastCCW = 0;

        // Darkhold Multi-Arms Animation parameters
        let darkholdWaveTime = 0;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 1. Voice Recognition Engine with Namaste Trigger
        function setupVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            speechRecognitionInstance = new SpeechRecognition();
            speechRecognitionInstance.continuous = true;
            speechRecognitionInstance.interimResults = false;
            speechRecognitionInstance.lang = 'en-US';

            speechRecognitionInstance.onresult = (event) => {
                const current = event.resultIndex;
                const text = event.results[current][0].transcript.trim().toLowerCase();
                
                if (text.includes('dark') || text.includes('hold') || text.includes('demon')) {
                    toggleDarkhold(true);
                } else if (text.includes('orange') || text.includes('shield')) {
                    activateShield('orange');
                } else if (text.includes('time') || text.includes('green')) {
                    activateShield('time');
                }
            };

            speechRecognitionInstance.onerror = (e) => {
                if (e.error !== 'no-speech') console.warn("Voice Notice: ", e.error);
            };

            speechRecognitionInstance.onend = () => {
                if (isVoiceListening) {
                    try { speechRecognitionInstance.start(); } catch(e){}
                }
            };
        }

        function setVoiceState(listen) {
            if (listen === isVoiceListening) return;
            isVoiceListening = listen;

            if (listen) {
                voiceDot.classList.add('active');
                try { speechRecognitionInstance && speechRecognitionInstance.start(); } catch(e){}
            } else {
                voiceDot.classList.remove('active');
                try { speechRecognitionInstance && speechRecognitionInstance.stop(); } catch(e){}
            }
        }

        function activateShield(type) {
            activeShieldType = type;
            if (shieldTimer) clearTimeout(shieldTimer);
            shieldTimer = setTimeout(() => {
                activeShieldType = null;
            }, 7000);
        }

        function toggleDarkhold(forceState = null) {
            if (forceState !== null) {
                isDarkholdActive = forceState;
            } else {
                isDarkholdActive = !isDarkholdActive;
            }

            if (isDarkholdActive) {
                darkDot.classList.add('active');
                if (darkholdTimer) clearTimeout(darkholdTimer);
                darkholdTimer = setTimeout(() => {
                    isDarkholdActive = false;
                    darkDot.classList.remove('active');
                }, 12000); // Active for 12 seconds
            } else {
                darkDot.classList.remove('active');
            }
        }

        // 2. Trailing Spark Engine for Portals
        class SparkStreak {
            constructor(cx, cy, baseAngle, radius) {
                this.cx = cx;
                this.cy = cy;
                this.baseAngle = baseAngle;
                this.distance = radius + (Math.random() * 24 - 12);
                this.speed = Math.random() * 0.08 + 0.04;
                this.radialVel = Math.random() * 2.5 - 0.8;
                
                const curX = this.cx + Math.cos(this.baseAngle) * this.distance;
                const curY = this.cy + Math.sin(this.baseAngle) * this.distance;
                this.history = [{x: curX, y: curY}];

                this.size = Math.random() * 2.5 + 1.2;
                this.hue = Math.random() * 15 + 25;
                this.alpha = 1.0;
                this.decay = Math.random() * 0.03 + 0.015;
                this.maxHistory = Math.floor(Math.random() * 6) + 4;
                this.active = true;
            }

            update(cx, cy, radius) {
                this.cx = cx;
                this.cy = cy;
                this.baseAngle += this.speed;
                this.distance += this.radialVel;

                const curX = this.cx + Math.cos(this.baseAngle) * this.distance;
                const curY = this.cy + Math.sin(this.baseAngle) * this.distance;

                this.history.push({x: curX, y: curY});
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                }

                this.alpha -= this.decay;
                if (this.alpha <= 0) this.active = false;
            }

            draw(ctx) {
                if (this.history.length < 2) return;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.history[0].x, this.history[0].y);
                for (let i = 1; i < this.history.length; i++) {
                    ctx.lineTo(this.history[i].x, this.history[i].y);
                }

                ctx.strokeStyle = `hsla(${this.hue}, 100%, 65%, ${this.alpha})`;
                ctx.lineWidth = this.size;
                ctx.lineCap = 'round';
                ctx.shadowBlur = this.size * 3;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 1)`;
                ctx.stroke();
                ctx.restore();
            }
        }

        const portalSparks = [];

        // 3. Darkhold Souls of the Damned: Multi-Arm Skeletal Wings & Dark Smoke Cloak
        function renderDarkholdCloak(ctx, centerX, centerY, scale) {
            ctx.save();
            darkholdWaveTime += 0.04;

            // Ambient Dark Red Fog / Vignette
            const fogGrad = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, scale * 3.5);
            fogGrad.addColorStop(0, 'rgba(80, 0, 20, 0.4)');
            fogGrad.addColorStop(0.6, 'rgba(30, 0, 10, 0.6)');
            fogGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // Damned Skeletal Shadow Arms (6 Pairs radiating outward)
            const armPairs = 7;
            for (let i = 0; i < armPairs; i++) {
                const baseAngleLeft = Math.PI * 0.8 + (i * 0.18) + Math.sin(darkholdWaveTime + i) * 0.08;
                const baseAngleRight = Math.PI * 0.2 - (i * 0.18) - Math.sin(darkholdWaveTime + i) * 0.08;
                const armLength = (scale * 2.2) + (i * 12);

                drawSkeletalDamnedArm(ctx, centerX, centerY, baseAngleLeft, armLength, darkholdWaveTime + i);
                drawSkeletalDamnedArm(ctx, centerX, centerY, baseAngleRight, armLength, darkholdWaveTime + i + 2);
            }

            // Floating Dark Musical / Energy Runes around hands
            const runeCount = 8;
            for (let i = 0; i < runeCount; i++) {
                const ang = (i * Math.PI * 2) / runeCount + darkholdWaveTime * 0.5;
                const dist = scale * 1.5 + Math.sin(darkholdWaveTime * 2 + i) * 20;
                const rx = centerX + Math.cos(ang) * dist;
                const ry = centerY + Math.sin(ang) * dist;

                ctx.save();
                ctx.beginPath();
                ctx.arc(rx, ry, Math.random() * 8 + 6, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0033';
                ctx.shadowColor = '#ff0055';
                ctx.shadowBlur = 18;
                ctx.fill();

                // Dark Energy Core
                ctx.beginPath();
                ctx.arc(rx, ry, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();
                ctx.restore();
            }

            ctx.restore();
        }

        // Skeletal Demonic Arm Drawer with Joint Angles & Claws
        function drawSkeletalDamnedArm(ctx, rootX, rootY, angle, length, waveOffset) {
            ctx.save();
            ctx.shadowColor = '#ff0033';
            ctx.shadowBlur = 15;

            // Joint 1: Shoulder to Elbow
            const elbowX = rootX + Math.cos(angle) * (length * 0.45);
            const elbowY = rootY + Math.sin(angle) * (length * 0.45) - 20;

            // Joint 2: Elbow to Wrist (with organic serpentine wave)
            const wristAngle = angle + Math.sin(waveOffset) * 0.35;
            const wristX = elbowX + Math.cos(wristAngle) * (length * 0.55);
            const wristY = elbowY + Math.sin(wristAngle) * (length * 0.55);

            // Draw Dark Skeletal Bone Arm
            ctx.beginPath();
            ctx.moveTo(rootX, rootY);
            ctx.quadraticCurveTo(elbowX + Math.sin(waveOffset)*15, elbowY, wristX, wristY);
            ctx.strokeStyle = '#1a0508';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Inner Red Core Vein
            ctx.beginPath();
            ctx.moveTo(rootX, rootY);
            ctx.quadraticCurveTo(elbowX + Math.sin(waveOffset)*15, elbowY, wristX, wristY);
            ctx.strokeStyle = '#ff003c';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw Skeletal Claws / Hands at wrist
            for (let f = -2; f <= 2; f++) {
                const clawAngle = wristAngle + (f * 0.25) + Math.sin(waveOffset * 1.5) * 0.15;
                const clawLen = 28 + Math.abs(f) * 4;
                const clawTipX = wristX + Math.cos(clawAngle) * clawLen;
                const clawTipY = wristY + Math.sin(clawAngle) * clawLen;

                ctx.beginPath();
                ctx.moveTo(wristX, wristY);
                ctx.lineTo(clawTipX, clawTipY);
                ctx.strokeStyle = '#0d0003';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(clawTipX, clawTipY, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ff2255';
                ctx.fill();
            }

            ctx.restore();
        }

        // 4. Multi-Layer SVG Shield Renderer
        function drawMultiLayerEldritchShield(ctx, x, y, radius, isGreen = false) {
            ctx.save();
            ctx.translate(x, y);

            rotSlowCW += 0.01;
            rotFastCW += 0.035;
            rotSlowCCW -= 0.008;
            rotFastCCW -= 0.025;

            const baseColor = isGreen ? '#00ff88' : '#ff6a00';
            const brightColor = isGreen ? '#e0fffa' : '#ffcc00';
            const shadowClr = isGreen ? '#00ff44' : '#ff4400';
            const scale = radius / 285;

            function circle(r, stroke, lw, dash = null) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, r * scale, 0, Math.PI * 2);
                ctx.strokeStyle = stroke;
                ctx.lineWidth = lw;
                ctx.shadowColor = shadowClr;
                ctx.shadowBlur = 12;
                if (dash) ctx.setLineDash(dash);
                ctx.stroke();
                ctx.restore();
            }

            function drawEquilateral(r, rotOffset = 0) {
                ctx.save();
                ctx.rotate(rotOffset);
                ctx.beginPath();
                for (let i = 0; i < 3; i++) {
                    const ang = (i * 2 * Math.PI / 3) - Math.PI / 2;
                    const px = Math.cos(ang) * (r * scale);
                    const py = Math.sin(ang) * (r * scale);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // Layer 1
            ctx.save();
            ctx.rotate(rotSlowCW);
            circle(8, brightColor, 3);
            circle(35, baseColor, 2);
            circle(60, brightColor, 2.5, [8, 12]);
            const sqSide = 120 * scale;
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(-sqSide/2, -sqSide/2, sqSide, sqSide);
            ctx.rotate(Math.PI / 4);
            ctx.strokeRect(-sqSide/2, -sqSide/2, sqSide, sqSide);
            ctx.restore();


            // Layer 2
            ctx.save();
            ctx.rotate(rotFastCCW);
            circle(110, baseColor, 4);
            circle(140, baseColor, 2, [8, 12]);
            ctx.strokeStyle = brightColor;
            ctx.lineWidth = 2.5;
            drawEquilateral(140, 0);
            drawEquilateral(140, Math.PI);
            ctx.beginPath();
            ctx.moveTo(-140 * scale, 0); ctx.lineTo(140 * scale, 0);
            ctx.moveTo(0, -140 * scale); ctx.lineTo(0, 140 * scale);
            ctx.stroke();
            ctx.restore();

            // Layer 3
            ctx.save();
            ctx.rotate(rotFastCW);
            circle(185, baseColor, 4);
            circle(225, baseColor, 3, [3, 15]);
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 2;
            drawEquilateral(190, 0.26);
            drawEquilateral(190, 2.35);
            drawEquilateral(190, 4.45);
            ctx.restore();

            // Layer 4
            ctx.save();
            ctx.rotate(rotSlowCCW);
            circle(260, brightColor, 4);
            circle(275, baseColor, 2, [8, 12]);
            circle(285, baseColor, 2);
            const nodeDist = 285 * scale;
            const nodes = [[0, nodeDist], [0, -nodeDist], [nodeDist, 0], [-nodeDist, 0]];
            ctx.fillStyle = brightColor;
            for (let n of nodes) {
                ctx.beginPath();
                ctx.arc(n[0], n[1], 4.5, 0, Math.PI * 2);
                ctx.shadowColor = shadowClr;
                ctx.shadowBlur = 10;
                ctx.fill();
            }
            ctx.restore();

            ctx.restore();
        }

        // 5. Cosmic Multiverse Portal Dimension
        function renderCosmicPortal(ctx, x, y, radius) {
            if (radius < 15) return;

            ctx.save();
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius * 0.78, 0, Math.PI * 2);
            ctx.clip();

            ctx.fillStyle = '#020008';
            ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);

            const grad = ctx.createRadialGradient(x, y, 5, x, y, radius * 0.78);
            grad.addColorStop(0, 'rgba(120, 0, 255, 0.6)');
            grad.addColorStop(0.5, 'rgba(0, 200, 255, 0.3)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0.9)');
            ctx.fillStyle = grad;
            ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);

            const time = Date.now() * 0.002;
            for (let i = 0; i < 30; i++) {
                const starAngle = i * 137.5;
                const starDist = ((i * 13 + time * 20) % (radius * 0.72));
                const sx = x + Math.cos(starAngle) * starDist;
                const sy = y + Math.sin(starAngle) * starDist;

                ctx.beginPath();
                ctx.arc(sx, sy, (i % 3) + 1, 0, Math.PI * 2);
                ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#ffd700';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 8;
                ctx.fill();
            }
            ctx.restore();

            ctx.beginPath();
            ctx.arc(x, y, radius * 0.8, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 15;
            ctx.stroke();

            for (let i = 0; i < 12; i++) {
                const randomAngle = Math.random() * Math.PI * 2;
                portalSparks.push(new SparkStreak(x, y, randomAngle, radius));
            }

            for (let i = portalSparks.length - 1; i >= 0; i--) {
                portalSparks[i].update(x, y, radius);
                portalSparks[i].draw(ctx);
                if (!portalSparks[i].active) portalSparks.splice(i, 1);
            }

            ctx.restore();
        }

        // 6. 5-Finger Whips
        function renderFiveFingerWhips(ctx, hand1, hand2) {
            const pairs = [4, 8, 12, 16, 20];

            pairs.forEach((fingerIdx, idx) => {
                const p1 = {
                    x: hand1[fingerIdx].x * canvasElement.width,
                    y: hand1[fingerIdx].y * canvasElement.height
                };
                const p2 = {
                    x: hand2[fingerIdx].x * canvasElement.width,
                    y: hand2[fingerIdx].y * canvasElement.height
                };

                ctx.save();
                ctx.shadowColor = '#ff6600';
                ctx.shadowBlur = 18;

                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2 + (idx * 12 + 18);

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 4 - idx * 0.35;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            });
        }

        function isNamastePose(hand1, hand2) {
            const wrist1 = hand1[0];
            const wrist2 = hand2[0];
            const middleTip1 = hand1[12];
            const middleTip2 = hand2[12];

            const wristDist = Math.hypot(wrist1.x - wrist2.x, wrist1.y - wrist2.y);
            const tipDist = Math.hypot(middleTip1.x - middleTip2.x, middleTip1.y - middleTip2.y);

            return wristDist < 0.22 && tipDist < 0.18;
        }

        // Processing Pipeline Loop
        function onResults(results) {
            if (loadingScreen.style.display !== 'none') {
                loadingScreen.style.display = 'none';
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDot.classList.add('active');

                // Render Darkhold Souls of Damned Cloak if Active
                if (isDarkholdActive) {
                    const firstPalm = results.multiHandLandmarks[0][9];
                    const cx = firstPalm.x * canvasElement.width;
                    const cy = firstPalm.y * canvasElement.height + 40;
                    renderDarkholdCloak(canvasCtx, cx, cy, 140);
                }

                // Draw Landmark Joint Tracking Dots
                results.multiHandLandmarks.forEach((landmarks) => {
                    landmarks.forEach((lm, idx) => {
                        const px = lm.x * canvasElement.width;
                        const py = lm.y * canvasElement.height;
                        canvasCtx.beginPath();
                        canvasCtx.arc(px, py, [4, 8, 12, 16, 20].includes(idx) ? 5 : 3.5, 0, Math.PI * 2);
                        canvasCtx.fillStyle = [4, 8, 12, 16, 20].includes(idx) ? '#00ffff' : (isDarkholdActive ? '#ff0033' : '#ff003c');
                        canvasCtx.shadowColor = isDarkholdActive ? '#ff0055' : '#00ffaa';
                        canvasCtx.shadowBlur = 6;
                        canvasCtx.fill();
                    });
                });

                if (results.multiHandLandmarks.length >= 2) {
                    const hand1 = results.multiHandLandmarks[0];
                    const hand2 = results.multiHandLandmarks[1];

                    // Check Namaste Pose
                    if (isNamastePose(hand1, hand2)) {
                        setVoiceState(true);
                    } else {
                        setVoiceState(false);
                    }

                    // Check Sling Ring Gesture
                    const isSlingPose = hand1[8].y < hand1[6].y && 
                                        hand1[12].y < hand1[10].y && 
                                        hand1[16].y > hand1[14].y;

                    if (isSlingPose && !isDarkholdActive) {
                        const portalCenter = {
                            x: hand1[9].x * canvasElement.width,
                            y: hand1[9].y * canvasElement.height
                        };

                        const rotatingTip = {
                            x: hand2[8].x * canvasElement.width,
                            y: hand2[8].y * canvasElement.height
                        };

                        const currentAngle = Math.atan2(rotatingTip.y - portalCenter.y, rotatingTip.x - portalCenter.x);

                        if (lastAngle !== null) {
                            let delta = currentAngle - lastAngle;
                            if (delta > Math.PI) delta -= Math.PI * 2;
                            if (delta < -Math.PI) delta += Math.PI * 2;

                            totalRotation += Math.abs(delta);
                            targetPortalRadius = Math.min(340, Math.max(50, totalRotation * 22));
                        }
                        lastAngle = currentAngle;

                        portalRadius += (targetPortalRadius - portalRadius) * 0.12;
                        renderCosmicPortal(canvasCtx, portalCenter.x, portalCenter.y, portalRadius);
                    } else {
                        lastAngle = null;
                        totalRotation = Math.max(0, totalRotation - 0.05);
                        portalRadius += (0 - portalRadius) * 0.12;

                        if (!isNamastePose(hand1, hand2) && !isDarkholdActive) {
                            renderFiveFingerWhips(canvasCtx, hand1, hand2);
                        }
                    }
                } else {
                    setVoiceState(false);
                    lastAngle = null;
                }

                // Render Shield when Active
                if (activeShieldType) {
                    results.multiHandLandmarks.forEach((landmarks) => {
                        const palmCenter = {
                            x: landmarks[9].x * canvasElement.width,
                            y: landmarks[9].y * canvasElement.height
                        };
                        const wrist = {
                            x: landmarks[0].x * canvasElement.width,
                            y: landmarks[0].y * canvasElement.height
                        };
                        const handScale = Math.hypot(palmCenter.x - wrist.x, palmCenter.y - wrist.y);
                        
                        drawMultiLayerEldritchShield(
                            canvasCtx, 
                            palmCenter.x, 
                            palmCenter.y, 
                            handScale * 2.1, 
                            activeShieldType === 'time'
                        );
                    });
                }

            } else {
                statusDot.classList.remove('active');
                setVoiceState(false);
            }

            canvasCtx.restore();
        }

        // Initialize MediaPipe Engine
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.75
        });

        hands.onResults(onResults);

        // Single Front Camera Pipeline
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().then(() => {
            setupVoiceRecognition();
        }).catch((err) => {
            console.error("Camera access error:", err);
            document.getElementById('loading-text').innerText = "Please grant camera permission.";
        });
    </script>
</body>
</html>
