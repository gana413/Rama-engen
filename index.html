<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZONYX - Sri Rama Simple AR Vision</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        canvas {
            transform: scaleX(-1); /* Mirror camera */
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
        video { display: none; }
    </style>
</head>
<body class="text-white select-none">

    <!-- Status UI -->
    <div class="absolute top-4 left-4 z-20 bg-black/80 border border-amber-500/50 p-4 rounded-xl max-w-xs pointer-events-none">
        <h1 class="text-lg font-bold text-amber-400">SRI RAMA AR - SIMPLE</h1>
        <p id="status-text" class="text-xs text-cyan-300 mt-1 font-mono">Show your hand to camera...</p>
    </div>

    <video id="webcam" playsinline></video>
    <div style="position: relative; width: 100vw; height: 100vh;">
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusText.innerText = `Hand Tracked: ${results.multiHandLandmarks.length} Found ✅`;
                statusText.className = "text-xs text-emerald-400 mt-1 font-mono font-bold";

                for (const landmarks of results.multiHandLandmarks) {
                    // 1. Draw Doctor Strange Style Hand Skeleton (Cyan & Pink Dots)
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FFCC', lineWidth: 3 });
                    drawLandmarks(canvasCtx, landmarks, { color: '#FF0055', lineWidth: 1, radius: 5 });

                    // Fingertips extra glowing dots
                    [4, 8, 12, 16, 20].forEach(idx => {
                        const pt = landmarks[idx];
                        canvasCtx.save();
                        canvasCtx.fillStyle = '#00FFFF';
                        canvasCtx.shadowColor = '#00FFFF';
                        canvasCtx.shadowBlur = 15;
                        canvasCtx.beginPath();
                        canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 7, 0, Math.PI * 2);
                        canvasCtx.fill();
                        canvasCtx.restore();
                    });

                    // 2. Attach a Simple Graphical Bow (కోదండం బొమ్మ) on Palm (Wrist / Middle MCP)
                    const wrist = landmarks[0];
                    const middleMCP = landmarks[9];
                    const wx = wrist.x * canvasElement.width;
                    const wy = wrist.y * canvasElement.height;
                    const mx = middleMCP.x * canvasElement.width;
                    const my = middleMCP.y * canvasElement.height;

                    // Center point for bow near hand
                    const cx = (wx + mx) / 2;
                    const cy = (wy + my) / 2;

                    canvasCtx.save();
                    canvasCtx.shadowColor = '#FFD700';
                    canvasCtx.shadowBlur = 20;

                    // Simple Bow Arc
                    canvasCtx.strokeStyle = '#FFD700';
                    canvasCtx.lineWidth = 10;
                    canvasCtx.beginPath();
                    canvasCtx.arc(cx, cy, 100, -Math.PI * 0.4, Math.PI * 0.4, false);
                    canvasCtx.stroke();

                    // Bow String
                    canvasCtx.strokeStyle = '#FFFFFF';
                    canvasCtx.lineWidth = 2;
                    canvasCtx.beginPath();
                    const topY = cy + Math.sin(-Math.PI * 0.4) * 100;
                    const topX = cx + Math.cos(-Math.PI * 0.4) * 100;
                    const botY = cy + Math.sin(Math.PI * 0.4) * 100;
                    const botX = cx + Math.cos(Math.PI * 0.4) * 100;
                    
                    canvasCtx.moveTo(topX, topY);
                    canvasCtx.lineTo(botX, botY);
                    canvasCtx.stroke();

                    canvasCtx.restore();
                }
            } else {
                statusText.innerText = "No hand detected. Show hand!";
                statusText.className = "text-xs text-red-400 mt-1 font-mono";
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.5net/npm/@mediapipe/hands/${file}`.replace('.5', '')
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().catch(err => {
            console.error("Camera Error:", err);
            statusText.innerText = "Camera Permission Denied!";
        });
    </script>
</body>
</html>
